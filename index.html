<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개 vs 고양이 인식기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        h1 { color: #333; }
        #webcam-container { margin: 20px auto; border: 5px solid #ddd; border-radius: 15px; display: inline-block; overflow: hidden; }
        #label-container { font-size: 28px; font-weight: bold; margin-top: 20px; color: #2c3e50; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>🐶 개 vs 고양이 인식기 🐱</h1>
    <button type="button" onclick="init()">카메라 켜기 및 시작</button>
    <div id="webcam-container"></div>
    <div id="label-container">화면을 분석할 준비가 되었습니다.</div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script>
        // 🚨 여기에 티쳐블 머신에서 복사한 모델 URL을 붙여넣으세요! 🚨
        const URL = "https://teachablemachine.withgoogle.com/models/hbOeNd5pK/";

        let model, webcam, labelContainer, maxPredictions;
        let lastSpokenClass = ""; // 중복 음성 방지를 위한 변수

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            document.getElementById("label-container").innerHTML = "모델을 불러오는 중입니다...";

            // 모델 로드
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 웹캠 설정
            const flip = true; // 좌우 반전
            webcam = new tmImage.Webcam(300, 300, flip);
            await webcam.setup(); // 웹캠 접근 권한 요청
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 화면에 웹캠 표시
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function loop() {
            webcam.update(); // 웹캠 프레임 업데이트
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            // 웹캠 이미지로 예측 실행
            const prediction = await model.predict(webcam.canvas);
            let highestProb = 0;
            let bestClass = "";

            // 가장 확률이 높은 결과물 찾기
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // 화면에 텍스트로 결과 출력 (예: 개 (확률: 95.5%))
            labelContainer.innerHTML = `${bestClass} (확률: ${(highestProb * 100).toFixed(1)}%)`;

            // ✅ 음성 출력 로직 (확률이 80% 이상이고, 이전 결과와 다를 때만 말함)
            if (highestProb > 0.8 && bestClass !== lastSpokenClass) {
                speakResult(bestClass);
                lastSpokenClass = bestClass;
            }
        }

        // ✅ 텍스트를 음성으로 읽어주는 함수 (Web Speech API)
        function speakResult(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 밀려있는 이전 음성 취소
                const speech = new SpeechSynthesisUtterance(text + " 입니다.");
                speech.lang = 'ko-KR'; // 한국어 설정
                speech.rate = 1.1;     // 말하기 속도
                window.speechSynthesis.speak(speech);
            }
        }
    </script>
</body>
</html>
